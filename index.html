<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Product Manager GPT</title>
</head>
<body>
    
    <div class="chat-container">
        <div class="chat-header">
            <h1>Product Manager GPT</h1>
            <div class="subtitle">Para stakeholders</div>
            <button id="toggleNightMode" onclick="alternarModoNoturno()">Modo Noturno</button>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input">
            <input id="perguntaInput" type="text" placeholder="Faça sua pergunta" onkeydown="verificarTecla(event)">
        </div>
    </div>
    
    <iframe 
      src="https://2e825a42-4393-4df5-a28e-1f9509e24464.lovableproject.com/embed" 
      width="100%" 
      height="80" 
      frameborder="0" 
      scrolling="no"
      style="
        border: none; 
        overflow: hidden; 
        max-width: 400px; 
        margin-top: 15px; 
        /* Centraliza o iframe na tela, assim como o chat-container */
        display: block;
      "
    ></iframe>

    <script src="script.js"></script>
</body>
</html>
