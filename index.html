<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>Product Manager GPT</title>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1><i class="fas fa-robot"></i> Product Manager GPT</h1>
            <div class="subtitle">Para stakeholders</div>
            
            <button id="exportButton" onclick="exportarHistoricoParaCSV()" title="Exportar conversas para CSV"><i class="fas fa-download"></i> Exportar</button>
            
            <button id="toggleNightMode" onclick="alternarModoNoturno()">Modo Noturno</button>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div id="typingIndicator" class="typing-indicator" style="display: none;">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>
        <div class="chat-input">
            <input id="perguntaInput" type="text" placeholder="Faça sua pergunta" onkeydown="verificarTecla(event)">
            <button id="sendButton" onclick="enviarMensagem()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
    <script src="script.js"></script>

    <div id="costTracker" class="cost-tracker">
        <div class="cost-text">Custo da interação</div>
        <span id="currentCost">R$ 0,00</span>
    </div>

    <button id="openPanelButton" onclick="toggleSidePanel()">
        <i class="fas fa-user-circle"></i>
    </button>

    <div id="sidePanel" class="side-panel">
        <button class="close-btn" onclick="toggleSidePanel()">&times;</button>
        <h2>Meus Contatos</h2>
        <div class="contact-icons">
            <a href="https://www.linkedin.com/in/hugomoraesapm/" target="_blank" title="LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>
            <a href="https://wa.me/SEU_NUMERO_AQUI" target="_blank" title="WhatsApp">
                <i class="fab fa-whatsapp-square"></i>
            </a>
        </div>
        <button class="download-cv-btn" onclick="downloadCV()">
            <i class="fas fa-download"></i> Baixar Currículo
        </button>
    </div>
  
    <iframe src="https://2e825a42-4393-4df5-a28e-1f9509e24464.lovableproject.com/embed" 
    style="width:100%;height:64px;border:0;overflow:hidden" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
